<title>Twin Time</title>
<style>
  :root {
    --bg: #f4f1ea; --card: #ffffff; --ink: #1f2a24; --muted: #6b746e; --line: #e4dfd3; --chip: #ebe7dc;
    --accent: #2f7d5b; --accent-ink: #ffffff;
    --need: #d9480f; --need-bg: #fdeee6; --maybe: #b7791f; --maybe-bg: #fbf1dc; --ok: #2b8a3e; --ok-bg: #e4f4e8; --offer: #3b6fd4; --offer-bg: #e6edfb;
    --appt: #7c4dcc; --appt-bg: #efe8fb;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 16px rgba(40,50,30,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151a17; --card: #1f2622; --ink: #eef2ee; --muted: #9aa59d; --line: #2c3530; --chip: #2a332e;
      --accent: #58c492; --accent-ink: #06150e;
      --need: #ff8a5c; --need-bg: #3a2218; --maybe: #f0b84f; --maybe-bg: #352912; --ok: #69db7c; --ok-bg: #1b3022; --offer: #7ea6ff; --offer-bg: #1c2740; --appt: #b79cff; --appt-bg: #2b2342;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: env(safe-area-inset-top) 16px calc(120px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { padding: 20px 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  h1 { margin: 0; font: 700 28px/1.1 ui-serif, Georgia, serif; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  .who { display: flex; align-items: center; gap: 8px; border: 0; background: var(--chip); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; padding: 5px 12px 5px 5px; border-radius: 999px; cursor: pointer; }
  .av { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; flex: none; }
  .banner { background: var(--chip); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin: 6px 0 10px; display: none; }
  .banner.show { display: block; }

  .tabs { display: flex; gap: 6px; background: var(--chip); padding: 4px; border-radius: 14px; margin: 8px 0 14px; }
  .tabs button { flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; font-size: 15px; padding: 9px; border-radius: 10px; cursor: pointer; }
  .tabs button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }


  .pill { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
  .pill.need { background: var(--need-bg); color: var(--need); } .pill.maybe { background: var(--maybe-bg); color: var(--maybe); }
  .pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.offer { background: var(--offer-bg); color: var(--offer); }
  .avs { display: flex; } .avs .av { margin-right: -6px; border: 2px solid var(--card); width: 26px; height: 26px; }
  .pill.appt { background: var(--appt-bg); color: var(--appt); } .shift.s-appt { border-left-color: var(--appt); }

  /* calendar */
  .calbar { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; }
  .calbar .mo { flex: 1; font: 700 18px/1.2 ui-serif, Georgia, serif; }
  .calbar button { border: 0; background: var(--chip); color: var(--ink); font: inherit; font-weight: 700; border-radius: 10px; padding: 7px 12px; cursor: pointer; }
  .people { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
  .people::-webkit-scrollbar { display: none; }
  .pchip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--chip); color: var(--ink); font: inherit; font-size: 14px; padding: 5px 12px 5px 6px; border-radius: 999px; cursor: pointer; }
  .pchip.all { padding-left: 12px; } .pchip .av { width: 22px; height: 22px; font-size: 11px; }
  .pchip.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .cal { margin: 0 -10px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--card); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
  .wd { display: flex; flex-direction: column; gap: 5px; padding: 0 5px 8px; min-height: 190px; border-left: 1px solid var(--line); border-top: 1px solid var(--line); min-width: 0; cursor: pointer; }
  .wd:nth-child(4n+1) { border-left: 0; } .wd:nth-child(-n+4) { border-top: 0; }
  .mm { border-left: 1px solid var(--line); border-top: 1px solid var(--line); display: grid; place-items: center; padding: 10px; min-height: 190px; } .mm svg { width: 100%; max-width: 120px; }
  .wd.today { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .wd.gone .ev { opacity: .6; }
  .dh { text-align: center; padding: 8px 0 6px; cursor: default; }
  .dh .dw { display: block; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .dh .dn { display: inline-grid; place-items: center; min-width: 28px; height: 28px; border-radius: 14px; font-size: 16px; font-weight: 700; }
  .wd.today .dh .dn { background: var(--accent); color: var(--accent-ink); }
  .ev { display: block; width: 100%; border: 0; border-left: 4px solid; border-radius: 8px; padding: 5px 6px; text-align: left; font: inherit; color: var(--ink); cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.1); min-width: 0; }
  .ev b { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; word-break: break-word; font-size: 13px; line-height: 1.2; }
  .ev .nt { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; word-break: break-word; font-size: 11px; line-height: 1.2; margin-top: 2px; }

<body>
<div class="wrap">
  <header>
    <h1>Twin <span>Time</span></h1>
    <button class="who" id="whoBtn" style="display:none"></button>
  </header>
  <div class="banner" id="banner"></div>
  <div class="tabs" id="tabs">
    <button data-t="cal" class="on">Calendar</button>
    <button data-t="cover" id="tabCover">Needs cover</button>
    <button data-t="needs">🛒 Things we need</button>
  </div>
  <div id="calView">
    <div class="calbar"><button id="calPrev" aria-label="Previous week">‹</button><div class="mo" id="calMonth"></div><button id="calToday">Today</button><button id="calNext" aria-label="Next week">›</button></div>
    <div class="people" id="people"></div>
    <div class="cal" id="cal"></div>
    <div class="legend"><span><i style="background:var(--need)"></i>Needs cover</span><span><i style="background:var(--ok)"></i>Covered</span><span><i style="background:var(--offer)"></i>Booked in</span><span><i style="background:var(--appt)"></i>Appointment</span></div>
  </div>
  <div id="coverView" style="display:none"><div id="coverList"></div></div>
  <div id="needsView" style="display:none">
    <form id="needForm" class="need-form" autocomplete="off"><input type="text" id="needInput" placeholder="Add an item…" maxlength="120" aria-label="New item" enterkeyhint="done"><button type="submit" class="need-add">Add</button></form>
    <div class="fine" id="needsStatus"></div>
    <div class="need-list" id="needsList"></div>
    <div class="fine" id="needsCount"></div>
  </div>
</div>

<button class="fab" id="fab" style="display:none"></button>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="inner" id="sheetBody"></div></div>
<div id="toast"></div>

<script>
/* ================= SETTINGS ================= */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwrp-pBo6D12a_Tk275BYgiDwTecC__wEIA3u5S4CZ-uGiQhSnOUqML_zlE8gfIODQ8wQ/exec';                       // your Apps Script web app URL (empty = this phone only, for trying it out)
const PARENTS = ['Ollie', 'Katie'];          // names that can confirm helpers and post shifts. Spelling must match when people pick their name
const APPT_LABELS = ['Health visitor', 'GP', 'Jabs', 'Hospital', 'Weigh-in', 'Baby group'];   // quick picks for appointments
/* ============================================ */

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const splitList = s => String(s || '').split('|').map(x => x.trim()).filter(Boolean);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const eq = (a, b) => String(a).toLowerCase() === String(b).toLowerCase();

let shifts = [], people = [], me = '', tab = 'cal', openId = null, openDate = null, opCount = 0;
const LS = { me: 'rota.me', data: 'rota.data' };
try { me = localStorage.getItem(LS.me) || ''; } catch (e) {}
const isParent = n => PARENTS.some(p => eq(p, n));

let toastTimer;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------------- data ---------------- */
// Sheets can turn "10:00" into "10:00:00" or a date into dd/mm/yyyy if someone edits a cell by hand, so tidy both
const normTime = v => { const m = String(v || '').match(/(\d{1,2}):(\d{2})/); return m ? pad(+m[1]) + ':' + m[2] : String(v || ''); };
const normDate = v => { v = String(v || '').trim(); const m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? `${m[3]}-${pad(+m[2])}-${pad(+m[1])}` : v.slice(0, 10); };
const rowToShift = r => ({ id: r[0], date: normDate(r[1]), start: normTime(r[2]), end: normTime(r[3]), what: r[4], notes: r[5], kind: r[6] || 'need', status: r[7] || 'open', helper: r[8], volunteers: splitList(r[9]), by: r[10], created: r[11],
  repeat: r[12] || '', until: r[13] ? normDate(r[13]) : '', skip: splitList(r[14]).map(normDate), allday: String(r[15] || '') === '1' });
const shiftFields = s => ({ id: s.id, date: s.date, start: s.start, end: s.end, what: s.what || '', notes: s.notes || '', kind: s.kind, status: s.status, helper: s.helper || '', volunteers: (s.volunteers || []).join('|'), by: s.by || '', created: s.created || ymd(new Date()), repeat: s.repeat || '', until: s.until || '', skip: (s.skip || []).join('|'), allday: s.allday ? '1' : '' });
function saveLocal() { try { localStorage.setItem(LS.data, JSON.stringify({ shifts, people, needs })); } catch (e) {} }
function loadLocal() { try { const d = JSON.parse(localStorage.getItem(LS.data) || '{}'); shifts = d.shifts || []; people = d.people || []; needs = d.needs || []; } catch (e) {} }

async function post(body) {
  if (!SCRIPT_URL) { saveLocal(); return; }
  opCount++;
  try { await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }); }
  catch (e) { toast("Couldn't reach the sheet. Check your connection."); }
  clearTimeout(reloadTimer); reloadTimer = setTimeout(() => load(true), 2000);
}
let reloadTimer;
async function load(quiet) {
  if (!SCRIPT_URL) { loadLocal(); render(); return; }
  const started = opCount;
  try {
    const j = await (await fetch(SCRIPT_URL, { redirect: 'follow' })).json();
    if (!j || !Array.isArray(j.shifts)) throw new Error('bad');
    if (opCount !== started) return;
    shifts = j.shifts.slice(1).filter(r => r[0] && r[1]).map(rowToShift);
    people = (j.people || []).slice(1).map(r => r[0]).filter(Boolean);
    if (Array.isArray(j.needs)) needs = j.needs.slice(1).filter(r => r[0] && r[1]).map(r => ({ id: String(r[0]), item: String(r[1]) }));
    saveLocal(); $('banner').classList.remove('show');
  } catch (e) {
    if (!shifts.length) loadLocal();
    $('banner').textContent = "Couldn't reach the shared sheet. Showing what's saved on this phone."; $('banner').classList.add('show');
  }
  render();
  if (openId && !$('sheet').classList.contains('editing')) { if (findOcc(openId, openDate)) renderSheet(openId, openDate); else closeSheet(); }
}

/* ---------------- time helpers ---------------- */
const startDT = s => new Date(`${s.date}T${s.start}:00`);
const endDT = s => { const e = new Date(`${s.date}T${s.end}:00`); if (s.end <= s.start) e.setDate(e.getDate() + 1); return e; };
function dayLabel(d) {
  const t = ymd(new Date()), tm = ymd(new Date(Date.now() + 864e5));
  const nice = new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' });
  return d === t ? `Today · ${nice}` : d === tm ? `Tomorrow · ${nice}` : nice;
}
const timeRange = s => s.allday ? 'All day' : `${s.start}–${s.end}${s.end <= s.start ? ' (+1 day)' : ''}`;

/* ---------------- repeats ---------------- */
// repeat codes: '' (once) | 'daily' | 'monthly' | 'weekly:1,3' | 'biweekly:1'   (days: 0 = Sunday ... 6 = Saturday)
const DOW = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const parseRepeat = r => { if (!r) return null; if (r === 'daily' || r === 'monthly') return { t: r }; const m = String(r).match(/^(weekly|biweekly):([\d,]+)$/); return m ? { t: m[1], days: m[2].split(',').map(Number) } : null; };
const dateOf = d => new Date(d + 'T12:00:00');                    // noon, so clock changes can't shift the day
const dayDiff = (a, b) => Math.round((dateOf(b) - dateOf(a)) / 864e5);
const addDays = (d, n) => { const x = dateOf(d); x.setDate(x.getDate() + n); return ymd(x); };
const weekIdx = d => Math.floor(dayDiff('2000-01-03', d) / 7);     // 3 Jan 2000 was a Monday
function occursOn(s, d) {
  if (d < s.date || (s.until && d > s.until) || s.skip.includes(d)) return false;
  const r = parseRepeat(s.repeat); if (!r) return d === s.date;
  if (r.t === 'daily') return true;
  if (r.t === 'monthly') { const dt = dateOf(d), dim = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate(); return +d.slice(8) === Math.min(+s.date.slice(8), dim); }
  if (!r.days.includes(dateOf(d).getDay())) return false;
  return r.t === 'weekly' || (((weekIdx(d) - weekIdx(s.date)) % 2) + 2) % 2 === 0;
}
function firstOnOrAfter(date, repeat) {          // the first real occurrence of a weekly rule on/after the chosen date
  const r = parseRepeat(repeat); if (!r || !r.days) return date;
  for (let i = 0; i < 14; i++) { const d = addDays(date, i); if (r.days.includes(dateOf(d).getDay())) return d; }
  return date;
}
function repeatText(s) {
  const r = parseRepeat(s.repeat); if (!r) return '';
  let t;
  if (r.t === 'daily') t = 'every day';
  else if (r.t === 'monthly') { const n = +s.date.slice(8), sfx = (n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({1:'st',2:'nd',3:'rd'}[n % 10] || 'th'); t = `monthly on the ${n}${sfx}`; }
  else {
    const days = [...r.days].sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7));
    const wk = days.length === 5 && !days.includes(0) && !days.includes(6);
    const names = wk ? 'weekday' : days.length === 1 ? DOW[days[0]] : days.map(d => DOW[d].slice(0, 3)).join(', ');
    t = r.t === 'biweekly' ? `every other ${names}` : `every ${names}`;
  }
  return t + (s.until ? ` until ${dateOf(s.until).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}` : '');
}
// turn series into the individual days they land on, for a range
function expand(from, to) {
  const out = [];
  shifts.forEach(s => {
    if (!parseRepeat(s.repeat)) { if (s.date >= from && s.date <= to) out.push({ ...s, base: s }); return; }
    const last = s.until && s.until < to ? s.until : to;
    for (let d = s.date > from ? s.date : from; d <= last; d = addDays(d, 1)) if (occursOn(s, d)) out.push({ ...s, date: d, occ: true, base: s });
  });
  return out;
}
let occs = [];
function findOcc(id, date) {
  const s = shifts.find(x => x.id === id); if (!s) return null;
  if (!parseRepeat(s.repeat)) return { ...s, base: s };
  const d = date || s.date; return occursOn(s, d) ? { ...s, date: d, occ: true, base: s } : null;
}

/* ---------------- people ---------------- */
const hue = n => { let h = 0; for (const c of String(n).toLowerCase()) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const avatar = n => `<span class="av" style="background:hsl(${hue(n)} 42% 42%)" title="${esc(n)}">${esc(String(n).trim().charAt(0).toUpperCase())}</span>`;
function everyone() {
  const seen = new Map();
  [...PARENTS, ...people, ...shifts.flatMap(s => [s.by, s.helper, ...s.volunteers])].filter(Boolean).forEach(n => { if (!seen.has(n.toLowerCase())) seen.set(n.toLowerCase(), n); });
  return [...seen.values()];
}

/* ---------------- status ---------------- */
function status(s) {
  if (s.kind === 'appt') return { cls: 'appt', text: s.volunteers.length ? `${s.volunteers.length} going` : 'Appointment', bar: 's-appt', short: s.volunteers.length ? s.volunteers.slice(0, 2).join(', ') + (s.volunteers.length > 2 ? '…' : '') + ' going' : 'Appointment', blk: 'b-appt' };
  if (s.kind === 'need') {
    const who = s.status === 'confirmed' ? [s.helper] : s.volunteers;
    if (who.length) return { cls: 'ok', text: `✓ ${who.join(', ')} covering`, bar: 's-ok', short: `✓ ${who.join(', ')}`, blk: 'b-ok' };
    return { cls: 'need', text: 'Needs cover', bar: 's-need', short: 'Needs cover', blk: 'b-need' };
  }
  const nm = s.by || s.volunteers[0] || 'Someone';      // a booking: someone putting themselves on the calendar
  return { cls: 'offer', text: `${nm} booked in`, bar: 's-offer', short: `${nm} booked in`, blk: 'b-offer' };
}
const needsParent = s => s.kind !== 'appt' && s.status === 'open' && (s.kind === 'offer' || s.volunteers.length);   // parent action: confirm someone
const uncovered = s => s.kind !== 'appt' && s.status === 'open' && s.kind === 'need' && !s.volunteers.length;
const involves = (s, n) => eq(s.by, n) || eq(s.helper, n) || s.volunteers.some(v => eq(v, n));

/* ---------------- render ---------------- */
// the "who are you" sheet can be open before the people list has loaded; refresh it unless they're typing
function whoStale() { const i = $('sheetBody').querySelector('#newName'); return !i || (!i.value && document.activeElement !== i); }
function render() {
  const wb = $('whoBtn');
  if (me) { wb.style.display = ''; wb.innerHTML = `${avatar(me)}${esc(me)}`; } else wb.style.display = 'none';
  const fab = $('fab'); fab.style.display = me && tab !== 'needs' ? '' : 'none'; fab.textContent = '＋ Add';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('calView').style.display = tab === 'cal' ? '' : 'none'; $('needsView').style.display = tab === 'needs' ? '' : 'none'; $('coverView').style.display = tab === 'cover' ? '' : 'none';
  const cv = coverSlots(), open = cv.filter(s => !isCovered(s)).length;
  $('tabCover').innerHTML = 'Needs cover' + (open ? `<span class="n">${open}</span>` : '');
  if (tab === 'cal') renderCal(); else if (tab === 'cover') renderCover(cv); else renderNeeds();
  if (!me && whoStale()) openWho();
}

/* ---------------- sheet plumbing ---------------- */
function openSheetEl() { $('scrim').classList.add('show'); $('sheet').classList.add('show'); }
function closeSheet() { openId = null; openDate = null; $('scrim').classList.remove('show'); $('sheet').classList.remove('show', 'editing'); }

function openWho() {
  openId = null;
  const names = everyone();
  $('sheetBody').innerHTML = `<h2>Who are you?</h2><div class="sub">Tap your name. This phone will remember it.</div>
    <div class="pickname">${names.map(n => `<button data-me="${esc(n)}">${avatar(n)}${esc(n)}${isParent(n) ? '<span class="tag">parent</span>' : ''}</button>`).join('')}</div>
    <label>Not in the list?</label><div class="two"><div><input class="inp" id="newName" placeholder="Your first name" maxlength="30" autocapitalize="words"></div><div style="flex:none"><button class="btn primary sm" id="addMe" style="padding:12px 18px">Join</button></div></div>
    <div class="err" id="whoErr"></div>`;
  $('sheet').classList.remove('editing'); openSheetEl();
}
function setMe(n) {
  me = n; try { localStorage.setItem(LS.me, n); } catch (e) {}

/* ---------------- shift sheet ---------------- */
function icsFor(s) {

  const when = s.allday ? [`DTSTART;VALUE=DATE:${dOnly(s.date)}`, `DTEND;VALUE=DATE:${dOnly(addDays(s.date, 1))}`] : [`DTSTART:${f(startDT(s))}`, `DTEND:${f(endDT(s))}`];
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Twin Time//EN', 'BEGIN:VEVENT', `UID:${s.id}-${s.date}@twintime`, `DTSTAMP:${f(new Date())}`, ...when,
    `SUMMARY:${esc2(s.kind === 'appt' ? (s.what || 'Appointment') : 'Childcare: ' + (s.what || 'helping with the babies'))}`, `DESCRIPTION:${esc2(s.notes)}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
}

}

}

}

/* ---------------- events ---------------- */
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; tab = b.dataset.t; render(); if (tab !== 'cal' && SCRIPT_URL) load(true); });
$('fab').addEventListener('click', () => openForm(null, tab === 'cover' && isParent(me) ? { kind: 'need' } : undefined));
$('coverList').addEventListener('click', e => {
  const b = e.target.closest('[data-cover]'); if (b) { volunteer(b.dataset.cover, true); return toast('Thanks! You\'re down to cover it'); }
  const c = e.target.closest('.cv'); if (c) renderSheet(c.dataset.id, c.dataset.d);
});
$('cal').addEventListener('click', e => {
  const b = e.target.closest('.ev'); if (b) return renderSheet(b.dataset.id, b.dataset.d);
  const col = e.target.closest('.wd'); if (!col || !me || e.target.closest('.dh')) return;
  openForm(null, { date: col.dataset.d });
});
$('people').addEventListener('click', e => { const c = e.target.closest('[data-p]'); if (c) { calFilter = c.dataset.p; renderCal(); } });
$('calToday').addEventListener('click', () => { weekStart = mondayOf(ymd(new Date())); renderCal(); });
$('calPrev').addEventListener('click', () => { weekStart = addDays(weekStart, -7); renderCal(); });
$('calNext').addEventListener('click', () => { weekStart = addDays(weekStart, 7); renderCal(); });
$('needForm').addEventListener('submit', e => { e.preventDefault(); const i = $('needInput'); if (addNeed(i.value)) i.value = ''; });
$('whoBtn').addEventListener('click', openWho);
$('scrim').addEventListener('click', () => { if (me) closeSheet(); });
$('sheetBody').addEventListener('change', e => {
  if (e.target.id === 'fAllday') $('fTimes').style.display = e.target.checked ? 'none' : '';
  if (e.target.id === 'fRepeat') syncRepeat();
  if (e.target.id === 'fDate' && !$('sheetBody').dataset.daysTouched && $('fDays')) {   // keep "every <weekday>" in step with the date until they pick days themselves
    const dow = dateOf(e.target.value || ymd(new Date())).getDay();
    document.querySelectorAll('#fDays button').forEach(b => b.classList.toggle('on', +b.dataset.dow === dow));
  }
});
$('sheetBody').addEventListener('click', e => {
  const t = e.target;
  const m = t.closest('[data-me]'); if (m) return setMe(m.dataset.me);
  if (t.id === 'addMe') { const n = $('newName').value.trim(); if (!n) { $('whoErr').textContent = 'Type your name first.'; return; } const known = everyone().find(x => eq(x, n)); return setMe(known || n); }
  if (t.id === 'fSave') return saveForm();
  const dw = t.closest('#fDays [data-dow]'); if (dw) { dw.classList.toggle('on'); $('sheetBody').dataset.daysTouched = '1'; return; }
  const kb = t.closest('[data-kind]');
  if (kb && kb.dataset.kind !== $('sheetBody').dataset.kind) { const v = readForm(); return openForm(null, { kind: kb.dataset.kind, date: v.date, start: v.start, end: v.end, what: $('fWhat').value, notes: $('fNotes').value, allday: v.allday, rtype: v.rtype, days: v.days, until: v.until }); }
  const lb = t.closest('[data-label]'); if (lb) { $('fWhat').value = lb.dataset.label; return; }
  const a = t.closest('[data-act]'); if (!a) return;
  const id = openId, date = openDate, s = findOcc(id, date), act = a.dataset.act, two = msg => { if (a.dataset.sure) return true; a.dataset.sure = '1'; a.textContent = msg; return false; };
  if (act === 'close') return closeSheet();
  if (act === 'back') return renderSheet($('sheetBody').dataset.editId, $('sheetBody').dataset.occ || date);
  if (!s) return;
  if (act === 'vol-on') { volunteer(id, true); toast(s.kind === 'appt' ? 'Great, you\'re on the list' : 'Thanks! You\'re down to cover it'); return renderSheet(id, date); }
  if (act === 'vol-off') { volunteer(id, false); return renderSheet(id, date); }
  if (act === 'confirm') { confirmShift(id, a.dataset.who); toast(`${a.dataset.who} is confirmed`); return renderSheet(id, date); }
  if (act === 'unconfirm') { patch(id, { status: 'open', helper: '' }); return renderSheet(id, date); }
  if (act === 'cantdo') { if (!two('Tap again to cancel')) return; const rest = s.base.volunteers.filter(v => !eq(v, me)); patch(id, { status: 'open', helper: '', volunteers: rest }); toast('Thanks for letting them know'); return renderSheet(id, date); }
  if (act === 'cantdo1') { if (!two('Tap again to confirm')) return; const one = splitOff(id, date, { status: 'open', helper: '', kind: 'need', volunteers: s.base.volunteers.filter(v => !eq(v, me)) }); toast('Thanks. That day is open again'); return renderSheet(one.id, date); }
  if (act === 'edit') return openForm(id);
  if (act === 'edit1') return openForm(id, { occDate: date });
  if (act === 'ics') return downloadIcs(s);
  if (act === 'del') { if (!two('Tap again to confirm')) return; closeSheet(); removeShift(id); return toast('Removed'); }
  if (act === 'del1') { if (!two('Tap again to confirm')) return; closeSheet(); skipDate(id, date); return toast('Removed for that day'); }
  if (act === 'delfrom') { if (!two('Tap again to confirm')) return; closeSheet(); deleteFrom(id, date); return toast(date <= s.base.date ? 'Series removed' : 'Series stopped'); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && SCRIPT_URL && !$('sheet').classList.contains('editing')) load(true); });

/* ---------------- boot ---------------- */
if (!SCRIPT_URL) { $('banner').textContent = 'Not connected to a Google Sheet yet, so Twin Time only lives on this phone.'; $('banner').classList.add('show'); }
loadLocal(); render(); load();
</script>
</body>
</html>
